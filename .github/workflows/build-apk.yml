name: Build Uangku APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Copy Uangku app files
        run: npm run copy:web

      - name: Generate Android project
        run: npx cap add android

      - name: Apply browser tab icon to Android launcher
        run: npm run apply:android-icon

      - name: Sync app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Uangku-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
